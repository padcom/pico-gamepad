name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # 0.10.1 (0.10.0 plus #195: parallel workers fetch git dependencies safely); 0.10.0 is the first release with std/posix and DataView, which the Linux backend uses.
  PICO_VERSION: 0.10.1

jobs:
  ci:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, linux: true }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, linux: true }
          - { target: macos-arm64, runner: macos-15, linux: false }
          - { target: windows-x64, runner: windows-2025, linux: false }
          - { target: windows-arm64, runner: windows-11-arm, linux: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        # Explicitly bash, which GitHub runs with -eo pipefail: a failing test isn't hidden by tee.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Pico
        env:
          GH_TOKEN: ${{ github.token }}
        # Fails the job if the release is missing: nothing below is optional.
        run: |
          v=$PICO_VERSION
          case "${{ matrix.target }}" in windows-*) archive=zip ;; *) archive=tar.gz ;; esac
          gh release download "v$v" -R padcom/pico-lang -p "pico-$v-${{ matrix.target }}.$archive" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pico"
          if [ "$archive" = zip ]; then
            unzip -q "$RUNNER_TEMP/pico-$v-${{ matrix.target }}.zip" -d "$RUNNER_TEMP/pico"
            cygpath -w "$(dirname "$(find "$RUNNER_TEMP/pico" -type f -name pico.exe | head -1)")" >> "$GITHUB_PATH"
          else
            tar -xzf "$RUNNER_TEMP/pico-$v-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/pico"
            dirname "$(find "$RUNNER_TEMP/pico" -type f -name pico -perm -u+x | head -1)" >> "$GITHUB_PATH"
          fi
      - name: Format
        run: |
          pico --version
          pico fmt --check .
      - name: Lint
        if: ${{ matrix.linux }}
        run: pico lint .
      # Off Linux the Linux backend can't be checked: it names C calls and files that other systems lack.
      - name: Lint (without the Linux-only files)
        if: ${{ !matrix.linux }}
        run: |
          echo "::warning::evdev.pi, posix.pi, sysfs.pi, system.linux.pi, spike/ and their tests aren't linted on ${{ matrix.target }}: Linux only."
          pico lint index.pi types.pi pad.pi watch.pi fake.pi decode.pi ioctl.pi system.pi unsupported.pi decode.test.pi pad.test.pi watch.test.pi unsupported.test.pi
      - name: Tests
        if: ${{ matrix.linux }}
        run: |
          pico test . | tee "$RUNNER_TEMP/test.log"
          bash .github/tests-ran.sh "$RUNNER_TEMP/test.log"
      - name: Tests (without the Linux-only files)
        if: ${{ !matrix.linux }}
        run: |
          echo "::warning::evdev.test.pi and the spike's tests are skipped on ${{ matrix.target }}: they need Linux (a sysfs tree, evdev)."
          pico test decode.test.pi pad.test.pi watch.test.pi unsupported.test.pi | tee "$RUNNER_TEMP/test.log"
          bash .github/tests-ran.sh "$RUNNER_TEMP/test.log"
      - name: A program using the package links
        run: pico build examples/pad-monitor.pi -o "$RUNNER_TEMP/pad-monitor${{ startsWith(matrix.target, 'windows') && '.exe' || '' }}"
